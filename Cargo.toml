[package]
name = "bee-search"
version = "0.1.0"
edition = "2021"
default-run = "bee-search"

[dependencies]
bitvec = "1"
modular-bitfield = "0.11"
lazy_static = "^1.4.0"
regex = "1.11.1"
rand = "0.9.0"
indicatif = "0.17.11"
clap = { version = "4.4", features = ["derive"] }
crossbeam = "0.8.4"
num_cpus = "1.17.0"
zstd = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bee_bench"
harness = false

[features]
