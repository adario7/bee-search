[build]
target-dir = "./build"
rustflags = [
	"-C", "target-cpu=native"
]

[target.x86_64-unknown-linux-gnu]
rustflags = [
#    "-C", "link-arg=-fuse-ld=mold",
	"-C", "target-cpu=native",
]

[target.x86_64-unknown-linux-musl]
rustflags = [
  "-C", "target-feature=-crt-static",
  "-C", "link-arg=-lm",
	"-C", "target-cpu=native",
]
